server:
  error:
    whitelabel:
      enabled: false
    path: /error
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: hw11
  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:h2:mem:hw11;DB_CLOSE_DELAY=10000;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  r2dbc:
    url: r2dbc:h2:mem:///hw11;DB_CLOSE_DELAY=10000;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    pool:
      enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: true
  shell:
    interactive:
      enabled: true
    script:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 0
    url: jdbc:h2:mem:hw11;DB_CLOSE_DELAY=10000;DB_CLOSE_ON_EXIT=FALSE
    user: sa
    password:
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
    encoding: UTF-8
    servlet:
      content-type: text/html;charset=UTF-8
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: false
            paths: /resources/**
logging:
  level:
    org:
      thymeleaf:
        error
      flywaydb:
        info
    ru.otus.hw: debug
    root: info