server:
  error:
    whitelabel:
      enabled: false
    path: /error
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:h2:mem:hw11;MODE=PostgreSQL
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: true
  shell:
    interactive:
      enabled: true
    script:
      enabled: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
    encoding: UTF-8
    servlet:
      content-type: text/html;charset=UTF-8
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: false
            paths: /resources/**
logging:
  level:
    org:
      springframework.orm.jpa: info
      thymeleaf:
        error
    root: info