<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{fragments/head :: header('(HW-11) Создание/Обновление книги')}"></div>
<body>
<div class="container-fluid w-75 p-3">
    <div class="card shadow bg-body-tertiary rounded">
        <div class="card-header" id="form-title">Загрузка...</div>
        <div class="card-body gy-0">
            <form id="book-form">
                <div class="form-floating mb-2">
                    <input class="form-control" id="bookTitleInput" type="text">
                    <label for="bookTitleInput">Название книги</label>
                    <div class="invalid-feedback d-none" id="title-error"></div>
                </div>

                <div class="form-floating mb-2">
                    <select class="form-select" id="bookAuthorInput">
                        <option value="">Загрузка авторов...</option>
                    </select>
                    <label for="bookAuthorInput">Выберите автора</label>
                    <div class="invalid-feedback d-none" id="authorId-error"></div>
                </div>

                <div class="form-floating mb-2">
                    <select class="form-select" id="bookGenreInput" multiple style="height: 450px;">
                        <option value="">Загрузка жанров...</option>
                    </select>
                    <label for="bookGenreInput">Выберите жанры книги</label>
                    <div class="invalid-feedback d-none" id="genreIds-error"></div>
                </div>

                <div class="alert alert-danger d-none" id="error-message"></div>

                <div class="mt-3">
                    <a class="btn btn-outline-info me-1" id="back-link" type="button">Назад</a>
                    <button class="btn btn-outline-info me-1" id="submit-btn" type="submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/form-base.js}"></script>
<script th:src="@{/js/book-form.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const isUpdate = /*[[${isUpdate}]]*/ false;
    const bookId = /*[[${bookId}]]*/ null;
    const previousUrl = /*[[${previousUrl}]]*/ '/books';
    bookFormManager.init(isUpdate, bookId, previousUrl);
    /*]]>*/
</script>
</body>
</html>
