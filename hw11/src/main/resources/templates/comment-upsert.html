<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{fragments/head :: header('(HW-11) Создание/Обновление комментария')}"></div>
<body>
<div class="container-fluid w-75 p-3">
    <div class="card shadow bg-body-tertiary rounded">
        <div class="card-header" id="form-title">Загрузка...</div>
        <div class="card-body gy-0">
            <form id="comment-form">
                <div class="form-floating mb-2">
                    <input class="form-control" id="commentTextInput" type="text">
                    <label for="commentTextInput">Текст комментария</label>
                    <div class="invalid-feedback d-none" id="text-error"></div>
                </div>

                <div class="alert alert-danger d-none" id="error-message"></div>

                <div class="mt-3">
                    <a class="btn btn-outline-info me-1" id="back-link" type="button">Назад</a>
                    <button class="btn btn-outline-info me-1" id="submit-btn" type="submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/form-base.js}"></script>
<script th:src="@{/js/comment-form.js}"></script>
<script th:inline="javascript">
    const isUpdate = /*[[${isUpdate}]]*/ false;
    const bookId = /*[[${bookId}]]*/ 0;
    const commentId = /*[[${commentId}]]*/ null;
    const previousUrl = /*[[${previousUrl}]]*/ '/books';
    commentFormManager.init(isUpdate, bookId, commentId, previousUrl);
</script>
</body>
</html>
